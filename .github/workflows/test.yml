name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install esphome

      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/esphome/wisafe2-bridge.yaml') }}

      - name: Generate test secrets
        working-directory: firmware/esphome
        run: |
          python -c "
          import base64, os, pathlib
          pathlib.Path('secrets.yaml').write_text(
              'wifi_ssid: \"ci\"\n'
              'wifi_password: \"cipassword\"\n'
              'fallback_password: \"cifallback\"\n'
              'api_encryption_key: \"%s\"\n' % base64.b64encode(os.urandom(32)).decode() +
              'ota_password: \"ciotapassword\"\n'
          )
          "

      - name: Validate shipped config
        working-directory: firmware/esphome
        run: esphome config wisafe2-bridge.yaml

      # Schema validation never runs codegen or the compiler, so build a variant with
      # alarms populated. This is what catches C++ errors in the component.
      - name: Compile with alarms configured
        working-directory: firmware/esphome
        run: |
          python ../../tools/make_test_config.py wisafe2-bridge.yaml ci-build.yaml
          esphome compile ci-build.yaml

