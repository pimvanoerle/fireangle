name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -q

  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome
      - name: Generate test secrets
        working-directory: firmware/esphome
        run: |
          python - <<'PY'
          import base64, os, pathlib
          pathlib.Path("secrets.yaml").write_text(
              'wifi_ssid: "ci"\n'
              'wifi_password: "cipassword"\n'
              'fallback_password: "cifallback"\n'
              f'api_encryption_key: "{base64.b64encode(os.urandom(32)).decode()}"\n'
              'ota_password: "ciota"\n'
          )
          PY
      - name: Validate config
        working-directory: firmware/esphome
        run: esphome config wisafe2-bridge.yaml

      - name: Compile with alarms configured
        working-directory: firmware/esphome
        run: |
          # `esphome config` only checks the schema -- it never runs codegen or the
          # compiler. Build a variant with alarms populated so the component's to_code
          # path and the C++ actually get exercised.
          python - <<'PY'
          import pathlib
          s = pathlib.Path("wisafe2-bridge.yaml").read_text()
          start = s.index("  alarms:")
          end = s.index("# --- Bridge health")
          s = s[:start] + '''  alarms:
    - name: "CI Smoke"
      device: "2d8d01"
      kind: smoke
    - name: "CI Heat"
      device: "a76f18"
      kind: heat

''' + s[end:]
          pathlib.Path("ci-build.yaml").write_text(s)
          PY
          esphome compile ci-build.yaml
